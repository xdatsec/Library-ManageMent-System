<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: white;
            font-size: 12px; /* Reduced font size to 12px */
        }

        header {
            background-color: white;
            text-align: left;
            padding: 10px;
            margin-right: 30px;
        }

        table {
            font-size: 12px; /* Reduced font size to 12px */
            width: 90%;
            margin: 0 auto;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 6px; /* Further reduced padding */
            text-align: left;
        }

        th {
            background-color: white;
        }

        tr {
            background-color: white;
        }

        thead {
            background-color: white;
            border-bottom: black 2px solid; /* Reduced border thickness */
            position: relative;
            z-index: 2;
        }

        h1 {
            font-family: 'Times New Roman', Times, serif;
            font-size: 24px; /* Reduced font size to 24px */
        }

        /* Responsive Styles */
        @media only screen and (max-width: 600px) {
            table {
                margin: 10px;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1 style="position: relative;top: 20px;left: 20px;">Accession Book - General Collection</h1>
    </header>

    <table>
        <thead>
            <tr>
                <th>Acc. No.</th>
                <th>D. Rec</th>
                <th>Call #</th>
                <th>Author</th>
                <th>Title</th>
                <th>Place of Pub</th>
                <th>Publisher</th>
                <th>Copyright</th>
                <th>Source</th>
                <th>Mr Page</th>
                <th>Status</th>
                <th>Price</th>
            </tr>
        </thead>
        <tbody>
            <!-- Your data rows go here -->
            <tr>
                <td>1</td>
                <td>2023-01-01</td>
                <td>QA123</td>
                <td>John Doe</td>
                <td>Sample Title</td>
                <td>City</td>
                <td>XYZ Publishers</td>
                <td>2020</td>
                <td>Sample Source</td>
                <td>Sample Mr Page</td>
                <td>Sample Status</td>
                <td>100.00</td>
            </tr>
            <!-- Add more rows as needed -->
        </tbody>
    </table>

</body>
</html>
